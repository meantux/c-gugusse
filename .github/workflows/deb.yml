name: Build .deb

# Every push / PR: build the package and keep it as a workflow artifact.
# Pushing a tag like v0.1.0: also publish it as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    # Native arm64 runner (free for public repos), so no cross-compiling.
    runs-on: ubuntu-24.04-arm
    # Raspberry Pi OS is Debian trixie plus the Raspberry Pi repository, so
    # build in the same environment.
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4

      - name: Add the Raspberry Pi apt repository
        run: |
          apt-get update
          # The signing key is kept in the repo (copied from Raspberry Pi OS's
          # raspberrypi-archive-keyring package): the one served at
          # archive.raspberrypi.com/debian/raspberrypi.gpg.key still has SHA1
          # signatures, which trixie's apt refuses.
          install -D -m 644 packaging/raspberrypi-archive-keyring.pgp \
            /usr/share/keyrings/raspberrypi-archive-keyring.pgp
          cat > /etc/apt/sources.list.d/raspi.sources <<'SRC'
          Types: deb
          URIs: http://archive.raspberrypi.com/debian/
          Suites: trixie
          Components: main
          Signed-By: /usr/share/keyrings/raspberrypi-archive-keyring.pgp
          SRC
          # Take libcamera and the libraries it needs (libpisp, tflite) from the
          # Raspberry Pi repo (a fork, newer than Debian's); everything else
          # stays on Debian.
          cat > /etc/apt/preferences.d/raspi <<'PIN'
          Package: *
          Pin: origin archive.raspberrypi.com
          Pin-Priority: 100

          Package: libcamera* libpisp* libtensorflow-lite*
          Pin: origin archive.raspberrypi.com
          Pin-Priority: 900
          PIN
          apt-get update

      - name: Install build dependencies
        run: |
          apt-get install -y --no-install-recommends debhelper fakeroot dpkg-dev lintian
          apt-get build-dep -y ./

      - name: Set the package version from the tag
        # dpkg-buildpackage names the .deb from debian/changelog's version,
        # not from the git ref, so without this every tag builds the same
        # c-gugusse_0.1.0_arm64.deb. Only tag pushes bump it (plain
        # branch/PR builds keep whatever's committed, which is fine since
        # those never get released).
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # v0.1.2-beta -> 0.1.2~beta (tilde sorts before the plain
          # release in Debian version comparisons, as a pre-release should).
          version="${GITHUB_REF_NAME#v}"
          version=$(printf %s "$version" | sed 's/-/~/')
          sed -i "0,/^c-gugusse (.*)/s//c-gugusse (${version})/" debian/changelog

      - name: Build
        run: dpkg-buildpackage -us -uc -b

      - name: Lint (informational)
        run: lintian --no-tag-display-limit ../c-gugusse_*.deb || true

      - name: Collect the package
        run: mkdir dist && cp ../c-gugusse_*.deb dist/

      - uses: actions/upload-artifact@v4
        with:
          name: c-gugusse-deb
          path: dist/*.deb

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: c-gugusse-deb
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ./*.deb --repo "$GITHUB_REPOSITORY" --generate-notes
